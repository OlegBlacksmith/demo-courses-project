[project]
name = "ai-services"
version = "0.1.0"
description = "AI-сервис для витрины курсов: переводчик, агенты, RAG"
readme = "README.md"
authors = [
    { name = "Oleg Blacksmith", email = "oil.kuz2104@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.4",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-services = "ai_services:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
